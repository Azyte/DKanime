<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="dk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a10" />
      <stop offset="100%" stop-color="#121624" />
    </linearGradient>
    <linearGradient id="dk-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="dk-p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="dk-p2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="60%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Squircle Border & Background -->
  <rect x="3" y="3" width="94" height="94" rx="24" fill="url(#dk-bg)" stroke="url(#dk-border)" stroke-width="4" />

  <!-- D Monogram Shield Curve -->
  <path
    d="M 22 20 
       C 22 17, 25 15, 29 15 
       L 42 15 
       C 58 15, 68 25, 68 40 
       C 68 47, 65 53, 60 57 
       L 46 57 
       C 51 51, 53 45, 53 40 
       C 53 29, 46 25, 38 25 
       L 34 25 
       L 34 75 
       C 34 81, 22 81, 22 75 
       Z"
    fill="url(#dk-p1)"
  />

  <!-- K Chevron & Forward Play Blade -->
  <path
    d="M 44 48 
       L 66 22 
       C 68 20, 74 22, 75 25 
       C 76 28, 74 31, 71 34 
       L 55 52 
       L 75 75 
       C 78 78, 75 83, 70 83 
       C 67 83, 64 81, 62 78 
       L 44 56 
       Z"
    fill="url(#dk-p2)"
  />

  <!-- Center Play Diamond Core -->
  <polygon points="58,50 68,44 80,50 68,56" fill="#ffffff" />
  <circle cx="82" cy="50" r="3.5" fill="#00f2fe" />
</svg>